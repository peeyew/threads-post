name: '[診断用/一時] DMM API調査(FloorList/GenreSearch/ItemList sort検証)'

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: FloorList取得・生レスポンス構造をダンプ
        run: |
          curl -s "https://api.dmm.com/affiliate/v3/FloorList?api_id=${{ secrets.DMM_API_ID }}&affiliate_id=${{ secrets.DMM_AFFILIATE_ID_THREADS }}&output=json" \
            -o floorlist.json
          echo "=== トップレベルキー ==="
          python3 -c "
          import json
          d = json.load(open('floorlist.json'))
          print('top keys:', list(d.keys()))
          print('result keys:', list(d.get('result', {}).keys()) if isinstance(d.get('result'), dict) else type(d.get('result')))
          "
          echo "=== dmmtvを含む行を生JSONからgrep ==="
          grep -o '.\{80\}dmmtv.\{80\}' floorlist.json || echo "dmmtv文字列なし"
          echo "=== 先頭2000文字 ==="
          head -c 2000 floorlist.json
          echo ""
          echo "=== dmmtvのfloor_idをテキスト抽出で特定 ==="
          python3 -c "
          import json, re
          d = json.load(open('floorlist.json'))
          r = d['result']
          site_list = r.get('site') if isinstance(r, dict) else r
          if isinstance(site_list, dict):
              site_list = [site_list]
          found = None
          for site in site_list or []:
              services = site.get('service', [])
              if isinstance(services, dict):
                  services = [services]
              for service in services:
                  if service.get('name') == 'dmmtv':
                      floors = service.get('floor', [])
                      if isinstance(floors, dict):
                          floors = [floors]
                      for floor in floors:
                          print('FLOOR:', floor)
                          if floor.get('code') == 'dmmtv_video':
                              found = floor.get('id')
          if found:
              with open('dmmtv_floor_id.txt', 'w') as f:
                  f.write(str(found))
              print('特定できたfloor_id:', found)
          else:
              print('dmmtv_videoのfloor_id特定失敗')
          " 2>&1 || echo "python解析失敗"

      - name: ItemList sort検証(date/rank/review)・dmmtv_video
        run: |
          for s in date rank review match price; do
            echo "=== sort=$s ==="
            curl -s "https://api.dmm.com/affiliate/v3/ItemList?api_id=${{ secrets.DMM_API_ID }}&affiliate_id=${{ secrets.DMM_AFFILIATE_ID_THREADS }}&site=DMM.com&service=dmmtv&floor=dmmtv_video&hits=3&sort=$s&output=json" \
              -o "sort_$s.json"
            python3 -c "
          import json
          d = json.load(open('sort_$s.json'))
          r = d.get('result', {})
          print('status:', r.get('status'), 'message:', r.get('result_message'))
          for item in r.get('items', [])[:3]:
              print(' title:', item.get('title'))
              print(' date:', item.get('date'))
              print(' review:', item.get('review'))
              print(' genre:', [g.get('name') for g in item.get('iteminfo', {}).get('genre', [])])
          "
          done

      - name: dmmtv_video上位100件のジャンル分布・アニメ該当作品確認
        run: |
          curl -s "https://api.dmm.com/affiliate/v3/ItemList?api_id=${{ secrets.DMM_API_ID }}&affiliate_id=${{ secrets.DMM_AFFILIATE_ID_THREADS }}&site=DMM.com&service=dmmtv&floor=dmmtv_video&hits=100&sort=rank&output=json" \
            -o anime_scan.json
          python3 -c "
          import json
          d = json.load(open('anime_scan.json'))
          r = d.get('result', {})
          print('status:', r.get('status'))
          genre_set = set()
          anime_titles = []
          for item in r.get('items', []):
              genres = [g.get('name') for g in item.get('iteminfo', {}).get('genre', [])]
              genre_set.update(genres)
              if any('アニメ' in g for g in genres):
                  anime_titles.append((item.get('title'), genres))
          print('出現したジャンル一覧:', sorted(genre_set))
          print('アニメ関連タイトル件数:', len(anime_titles))
          for t, g in anime_titles[:10]:
              print(' -', t, g)
          "

      - name: ItemListでkeyword=アニメを試す(genreフィールドが空のため代替手段として)
        run: |
          curl -s "https://api.dmm.com/affiliate/v3/ItemList?api_id=${{ secrets.DMM_API_ID }}&affiliate_id=${{ secrets.DMM_AFFILIATE_ID_THREADS }}&site=DMM.com&service=dmmtv&floor=dmmtv_video&hits=10&sort=rank&keyword=アニメ&output=json" \
            -o keyword_anime.json
          python3 -c "
          import json
          d = json.load(open('keyword_anime.json'))
          r = d.get('result', {})
          print('status:', r.get('status'), 'message:', r.get('result_message'))
          print('件数(total_count):', r.get('total_count'))
          for item in r.get('items', [])[:10]:
              print(' -', item.get('title'))
          "

      - name: 1件分のitem生レスポンス全フィールドをダンプ(genre以外にジャンル体系がないか確認)
        run: |
          curl -s "https://api.dmm.com/affiliate/v3/ItemList?api_id=${{ secrets.DMM_API_ID }}&affiliate_id=${{ secrets.DMM_AFFILIATE_ID_THREADS }}&site=DMM.com&service=dmmtv&floor=dmmtv_video&hits=1&sort=rank&keyword=アニメ&output=json" \
            -o single_item.json
          python3 -c "
          import json
          d = json.load(open('single_item.json'))
          items = d.get('result', {}).get('items', [])
          if items:
              print(json.dumps(items[0], ensure_ascii=False, indent=2))
          else:
              print('items空')
          "

      - name: GenreSearchでdmmtv_video(floor_id=95)のジャンル一覧取得
        run: |
          curl -s "https://api.dmm.com/affiliate/v3/GenreSearch?api_id=${{ secrets.DMM_API_ID }}&affiliate_id=${{ secrets.DMM_AFFILIATE_ID_THREADS }}&floor_id=95&hits=500&output=json" \
            -o genre_search.json
          python3 -c "
          import json
          d = json.load(open('genre_search.json'))
          r = d.get('result', {})
          print('status:', r.get('status'), 'message:', r.get('result_message'))
          names = [g.get('name') for g in r.get('genre', [])]
          print('ジャンル総数:', len(names))
          print('全ジャンル:', names)
          print('アニメ含むジャンル:', [n for n in names if n and 'アニメ' in n])
          "
