name: '[診断用/一時] 評価あり経路の確認(commitなし)'

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 評価件数の分布と、評価あり作品の本文生成(posts.jsonは更新しない)
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID_THREADS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > probe.mjs <<'JS'
          import { generateBody, findBannedContent, loadRecentBodies } from './copywriter.js';
          const base = `https://api.dmm.com/affiliate/v3/ItemList?api_id=${process.env.DMM_API_ID}&affiliate_id=${process.env.DMM_AFFILIATE_ID}&site=DMM.com&service=dmmtv&floor=dmmtv_video&output=json`;
          const idPat = /^\d{3,5}[a-z]+\d+$/i;
          const all = [];
          for (const kw of ['ドラマ', '映画', 'バラエティ']) {
            const res = await fetch(`${base}&keyword=${encodeURIComponent(kw)}&sort=rank&hits=100`);
            const items = (await res.json()).result?.items || [];
            for (const it of items) {
              if (idPat.test(it.content_id)) continue;
              all.push({ kw, title: it.title, avg: it.review?.average != null ? Number(it.review.average) : null, count: Number(it.review?.count ?? 0) });
            }
          }
          const n = all.length;
          const ge = (m) => all.filter(x => x.count >= m).length;
          console.log(`ランキング上位(品番風ID除外後) ${n}件: 評価なし=${all.filter(x => !x.count).length} 1-4件=${all.filter(x => x.count >= 1 && x.count < 5).length} 5-19件=${all.filter(x => x.count >= 5 && x.count < 20).length} 20件以上=${ge(20)} (${(ge(20) / n * 100).toFixed(0)}%) 100件以上=${ge(100)}`);
          console.log(`20件以上のうち平均4.0以上=${all.filter(x => x.count >= 20 && x.avg >= 4).length}件`);
          const targets = [];
          const seenKw = {};
          for (const x of all) { if (x.count >= 20 && (seenKw[x.kw] || 0) < 2) { seenKw[x.kw] = (seenKw[x.kw] || 0) + 1; targets.push(x); } }
          const recent = loadRecentBodies('./posts.json', undefined, { variant: 'other' });
          for (const x of targets) {
            try {
              const r = await generateBody({ source: 'dmmtv', mode: 'other', title: x.title, genres: [x.kw], review: { average: x.avg, count: x.count } }, recent);
              const issues = findBannedContent(r.text, x.title, { average: x.avg, count: x.count });
              console.log(`[${x.kw}] ${x.title} | 事実: 平均${x.avg} / ${x.count}件\n    本文: ${r.text}\n    検査: ${issues.length ? JSON.stringify(issues) : 'OK'}`);
              recent.unshift(r.text);
            } catch (e) { console.log(`[${x.kw}] ${x.title} | 事実: 平均${x.avg} / ${x.count}件\n    生成エラー(フォールバックになる): ${e.message}`); }
          }
          JS
          node probe.mjs
