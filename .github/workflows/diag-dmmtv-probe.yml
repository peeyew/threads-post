name: '[診断用/一時] DMM TV API試し引き'

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 閲覧数上位6件の素性と、他ジャンルkeyword検索の混入確認(URL/ID類は出さない)
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID_THREADS }}
        run: |
          cat > probe.mjs <<'JS'
          import { readFileSync } from 'fs';
          const base = `https://api.dmm.com/affiliate/v3/ItemList?api_id=${process.env.DMM_API_ID}&affiliate_id=${process.env.DMM_AFFILIATE_ID}&site=DMM.com&service=dmmtv&floor=dmmtv_video&output=json`;
          async function list(extra) {
            const res = await fetch(`${base}&${extra}`);
            const data = await res.json();
            const r = data.result;
            if (!r || Number(r.status) !== 200) { console.log(`  API失敗: ${r?.result_message || res.status}`); return []; }
            return r.items || [];
          }
          const ng = JSON.parse(readFileSync('./config/ng-words.json', 'utf-8'));
          const idPat = /^\d{3,5}[a-z]+\d+$/i;
          const suspicious = /グラビア|DVD|Blu-?ray|イメージ|水着|写真集|ビデオ|アイドル|ミニスカ|セクシー|美少女|ビキニ|ランジェリー|撮影会|ギャル/;

          console.log('## A. 閲覧数上位6件の素性(cidで照会)');
          const targets = [
            ['桃木兎羽', '5790mizu00061'], ['吉田優花', '5790mizu00053'], ['霊幽', '4dwoqzzrc56p9zzahxz26xsnc'],
            ['レゼ舞台版', '5162stage260803'], ['チャポン', 'tpzwu681rs7x5n5uyx0uqfsi2'], ['卒業してもの', '9sx4x51btx9f01k8ug8airn9d'],
          ];
          for (const [label, cid] of targets) {
            let items = await list(`cid=${cid}&hits=1`);
            if (items.length === 0) items = await list(`keyword=${encodeURIComponent(label.replace(/(舞台版|の)$/, ''))}&hits=30`);
            const it = items.find(i => (i.content_id || i.product_id) === cid) || items[0];
            if (!it) { console.log(`[${label}] 取得できず`); continue; }
            const hit = (it.content_id || it.product_id) === cid;
            console.log(`[${label}] cid一致=${hit} idPat=${idPat.test(cid)} title=${it.title}`);
            console.log(`  topKeys=${Object.keys(it).join(',')}`);
            const safe = {};
            for (const [k, v] of Object.entries(it)) {
              if (/url|image/i.test(k) || k === 'title') continue;
              safe[k] = typeof v === 'string' && v.length > 120 ? v.slice(0, 120) + '…' : v;
            }
            console.log(`  fields=${JSON.stringify(safe)}`);
          }

          console.log('\n## B. 他ジャンルkeyword検索の混入確認');
          for (const kw of ['ドラマ', '映画', 'バラエティ']) {
            for (const sort of ['review', 'date', 'rank']) {
              const items = await list(`keyword=${encodeURIComponent(kw)}&sort=${sort}&hits=30`);
              let idHit = 0, ngHit = 0, passSusp = 0;
              const lines = [];
              items.forEach((it, i) => {
                const cid = it.content_id || it.product_id || '';
                const t = it.title || '';
                const isId = idPat.test(cid), isNg = ng.some(w => t.includes(w)), isSusp = suspicious.test(t);
                if (isId) idHit++; if (isNg) ngHit++;
                const pass = !isId && !isNg;
                if (pass && isSusp) passSusp++;
                lines.push(`  ${String(i + 1).padStart(2)}. ${pass ? 'PASS' : 'drop'}${isId ? '[ID]' : ''}${isNg ? '[NG]' : ''}${isSusp ? '[怪しい語]' : ''} ${t.slice(0, 50)}`);
              });
              console.log(`\n### keyword=${kw} sort=${sort}: 取得${items.length}件 品番風ID=${idHit} NG語=${ngHit} 通過したが怪しい語あり=${passSusp}`);
              lines.forEach(l => console.log(l));
            }
          }
          JS
          node probe.mjs
