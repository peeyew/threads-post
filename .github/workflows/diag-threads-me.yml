name: '[診断用/一時] Threads /me username確認'

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: /meのusernameのみ出力(トークン・他フィールドは出さない)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          curl -s -G "https://graph.threads.net/v1.0/me" \
            --data-urlencode "fields=username" \
            --data-urlencode "access_token=${THREADS_ACCESS_TOKEN}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('username:', d.get('username', '(取得失敗)'))
          if 'error' in d:
              print('error_type:', d['error'].get('type'))
          "
