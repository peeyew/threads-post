name: '[診断用/一時] 成人向け語の除外効果確認(commitなし)'

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: アニメ枠/他ジャンル枠それぞれで、成人向け語を含む作品が除外後に残るかを確認
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID_THREADS }}
        run: |
          cat > probe.mjs <<'JS'
          import { readFileSync } from 'fs';
          const base = `https://api.dmm.com/affiliate/v3/ItemList?api_id=${process.env.DMM_API_ID}&affiliate_id=${process.env.DMM_AFFILIATE_ID}&site=DMM.com&service=dmmtv&floor=dmmtv_video&output=json`;
          const j = f => JSON.parse(readFileSync(f, 'utf-8'));
          const ng = j('config/ng-words.json'), animeEx = j('config/dmmtv-anime-exclude-words.json'), otherEx = j('config/dmmtv-other-exclude-words.json');
          const idPat = /^\d{3,5}[a-z]+\d+$/i;
          async function list(extra) { const r = (await (await fetch(`${base}&${extra}`)).json()).result; return r?.items || []; }
          const adult = new RegExp(otherEx.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'));
          const slots = {
            'アニメ新着(latest)': ['keyword=%E3%82%A2%E3%83%8B%E3%83%A1&sort=date', [...ng, ...animeEx]],
            'アニメ評価順(popular)': ['keyword=%E3%82%A2%E3%83%8B%E3%83%A1&sort=review', [...ng, ...animeEx]],
            'ドラマ(other)': ['keyword=%E3%83%89%E3%83%A9%E3%83%9E&sort=rank', [...ng, ...animeEx, ...otherEx]],
            '映画(other)': ['keyword=%E6%98%A0%E7%94%BB&sort=rank', [...ng, ...animeEx, ...otherEx]],
            'バラエティ(other)': ['keyword=%E3%83%90%E3%83%A9%E3%82%A8%E3%83%86%E3%82%A3&sort=rank', [...ng, ...animeEx, ...otherEx]],
          };
          for (const [name, [q, words]] of Object.entries(slots)) {
            let items = [];
            for (const off of [1, 101, 201]) items = items.concat(await list(`${q}&hits=100&offset=${off}`));
            const cand = items.filter(i => !idPat.test(i.content_id));
            const passed = cand.filter(i => !words.some(w => i.title.includes(w)));
            const leaked = passed.filter(i => adult.test(i.title));
            console.log(`${name}: 取得${items.length} 品番風ID除外後${cand.length} 現行フィルタ通過${passed.length} → 成人向け語を含んで通過=${leaked.length}件`);
            leaked.slice(0, 8).forEach(i => console.log(`    ${i.title}`));
          }
          JS
          node probe.mjs
