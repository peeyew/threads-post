name: '[診断用/一時] アニメ枠 成人向け除外の効果確認(commitなし)'

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DMM_SLOT: dmmtv
      DMM_API_ID: ${{ secrets.DMM_API_ID }}
      DMM_AFFILIATE_ID_THREADS: ${{ secrets.DMM_AFFILIATE_ID_THREADS }}
      DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID_THREADS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 候補プールの減り具合(適用前後、上位300件ずつ)
        run: |
          cat > pool.mjs <<'JS'
          import { readFileSync } from 'fs';
          const base = `https://api.dmm.com/affiliate/v3/ItemList?api_id=${process.env.DMM_API_ID}&affiliate_id=${process.env.DMM_AFFILIATE_ID}&site=DMM.com&service=dmmtv&floor=dmmtv_video&output=json`;
          const j = f => JSON.parse(readFileSync(f, 'utf-8'));
          const ng = j('config/ng-words.json'), animeEx = j('config/dmmtv-anime-exclude-words.json'), adult = j('config/dmmtv-other-exclude-words.json');
          const idPat = /^\d{3,5}[a-z]+\d+$/i;
          async function list(q) { const r = (await (await fetch(`${base}&${q}`)).json()).result; return r?.items || []; }
          for (const [name, sort] of [['新着(latest)', 'date'], ['評価順(popular, 評価5件以上)', 'review']]) {
            let items = [];
            for (const off of [1, 101, 201]) items = items.concat(await list(`keyword=%E3%82%A2%E3%83%8B%E3%83%A1&sort=${sort}&hits=100&offset=${off}`));
            let pool = items.filter(i => !idPat.test(i.content_id));
            if (sort === 'review') pool = pool.filter(i => Number(i.review?.count ?? 0) >= 5);
            const before = pool.filter(i => ![...ng, ...animeEx].some(w => i.title.includes(w)));
            const after = before.filter(i => !adult.some(w => i.title.includes(w)));
            console.log(`${name}: 取得${items.length} → 品番風ID等除外後の候補 適用前${before.length}件 / 適用後${after.length}件 (減少${before.length - after.length}件)`);
            before.filter(i => !after.includes(i)).forEach(i => console.log(`    除外: ${i.title}`));
          }
          JS
          node pool.mjs
      - name: 実際のfetch-dmm.jsでアニメ枠を3件ずつ生成(posts.jsonはcommitしない)
        run: |
          for mode in latest popular; do
            echo "=== $mode ==="
            DMM_TV_MODE=$mode DMM_HITS=3 node fetch-dmm.js
            node -e "const a=JSON.parse(require('fs').readFileSync('posts.json','utf8'));a.slice(-3).forEach((p,i)=>console.log('  ['+(i+1)+'] '+p.category+' | '+p.title+' | '+p.body))"
          done
