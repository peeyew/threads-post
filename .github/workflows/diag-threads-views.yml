name: '[診断用/一時] Threads views集計'

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: GASのthreadsデータをtype別に集計(URL・トークンは出さない)
        env:
          GAS_ENDPOINT: ${{ secrets.GAS_ENDPOINT }}
        run: |
          cat > report.mjs <<'JS'
          const res = await fetch(`${process.env.GAS_ENDPOINT}?action=get_threads_data`, { redirect: 'follow' });
          const rows = await res.json();
          if (!Array.isArray(rows)) { console.log('想定外の応答形式'); process.exit(1); }
          console.log(`取得行数: ${rows.length}`);
          console.log(`列名: ${Object.keys(rows[0] || {}).join(', ')}`);
          const now = Date.now();
          const HOUR = 3600 * 1000;
          const enriched = rows.map(r => ({
            type: r.type || '(不明)',
            keyword: String(r.keyword || '').slice(0, 30),
            views: r.views === '' || r.views == null ? null : Number(r.views),
            ageH: r.postedAt ? (now - new Date(r.postedAt).getTime()) / HOUR : null,
          }));
          const fresh = enriched.filter(r => r.ageH == null || r.ageH < 24);
          const mature = enriched.filter(r => r.ageH != null && r.ageH >= 24);
          const measured = mature.filter(r => Number.isFinite(r.views));
          const unmeasured = mature.length - measured.length;
          const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
          const fmtAge = h => h == null ? '-' : h < 48 ? `${h.toFixed(0)}時間` : `${(h / 24).toFixed(1)}日`;

          console.log('\n## 1. typeごとの集計(経過24時間以上・views計測済み)');
          const types = [...new Set(measured.map(r => r.type))];
          for (const t of types) {
            const v = measured.filter(r => r.type === t).map(r => r.views);
            const avg = v.reduce((a, b) => a + b, 0) / v.length;
            console.log(`${t}: 件数=${v.length} 平均=${avg.toFixed(1)} 中央値=${median(v)} 最大=${Math.max(...v)}`);
          }
          console.log(`(24時間以上だがviews未計測: ${unmeasured}件)`);

          console.log('\n## 2. views上位10件');
          [...measured].sort((a, b) => b.views - a.views).slice(0, 10).forEach((r, i) =>
            console.log(`${i + 1}. [${r.type}] ${r.keyword} views=${r.views} 経過=${fmtAge(r.ageH)}`));

          console.log('\n## 3. 経過24時間未満(集計対象外)');
          if (fresh.length === 0) console.log('なし');
          fresh.forEach(r => console.log(`[${r.type}] ${r.keyword} views=${Number.isFinite(r.views) ? r.views : '未計測'} 経過=${fmtAge(r.ageH)}`));
          JS
          node report.mjs
